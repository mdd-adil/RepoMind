services:
  postgres:
    image: postgres:16-alpine
    container_name: repo_visualizer_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: repo_visualizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgweb:
    image: sosedoff/pgweb
    container_name: repo_visualizer_pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/repo_visualizer?sslmode=disable
    depends_on:
      - postgres

volumes:
  pgdata:
